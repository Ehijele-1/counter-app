<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter Dashboard</title>
    <link rel="stylesheet" href="counter-app.css" />
  </head>
  <body>
    <h1>Counter Dashboard</h1>
    <div id="value">0</div>

    <div class="counter">
      <button id="decrement" type="button" aria-label="Decrease counter">-</button>
      <button id="increment" type="button" aria-label="Increase counter">+</button>
      <button id="reset" type="button">Reset</button>
    </div>

    <p>Last Action: <span id="last-action">None</span></p>

    <script src="counter-app.js"></script>
  </body>
</html>
